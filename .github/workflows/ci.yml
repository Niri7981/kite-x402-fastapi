name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ".[dev]"
      - name: Generate Markdown evaluation report
        id: evaluation_report
        run: kite-x402-evaluate --format markdown > evaluation-report.md
      - run: kite-x402-evaluate
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/smoke_installed.py dist/*.whl
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.evaluation_report.outcome != 'skipped' }}
        with:
          name: x402-evaluation-report
          path: evaluation-report.md
          if-no-files-found: error
